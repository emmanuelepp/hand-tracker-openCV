[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hand-tracker-opencv"
version = "0.1.0"
description = "Real-time hand tracking and finger counting with OpenCV"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Emmanuel" }]
requires-python = ">=3.10"
dependencies = [
  "opencv-python>=4.8",
  "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.5",
]
notebook = [
  "jupyter",
  "scikit-learn",  # used by the original notebook for euclidean distances
]

[project.scripts]
hand-tracker = "hand_tracker.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "NPY"]
